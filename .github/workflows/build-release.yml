name: Build & Release Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ViGEmBus Driver (Headless CI)
        run: choco install vigembus -y --no-progress

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r pc/requirements.txt

      - name: Build Standalone Executable
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "RemoteGamepadReceiver" `
            --icon="pc/app.ico" `
            --add-data "static;static" `
            --hidden-import="aiohttp" `
            --hidden-import="qrcode" `
            --hidden-import="PIL" `
            --hidden-import="PIL.ImageTk" `
            --hidden-import="updater" `
            --hidden-import="driver_installer" `
            pc/app.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Build Windows Installer (Setup.exe)
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          & $iscc installer/setup.iss

      - name: Create GitHub Release and Upload Binaries
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/RemoteGamepadReceiver.exe
            installer/RemoteGamepad-Setup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
