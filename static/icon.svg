<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#020c18" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2434"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0055ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)"/>
  <rect width="510" height="510" x="1" y="1" rx="110" fill="none" stroke="url(#cyanBorder)" stroke-width="4" opacity="0.6"/>

  <!-- Controller Silhouette -->
  <path d="M 130 180 C 180 180, 200 210, 256 210 C 312 210, 332 180, 382 180 C 440 180, 480 230, 460 350 C 450 410, 390 420, 350 370 C 320 330, 300 320, 256 320 C 212 320, 192 330, 162 370 C 122 420, 62 410, 52 350 C 32 230, 72 180, 130 180 Z" fill="url(#bodyGrad)" stroke="#00d4ff" stroke-width="6"/>

  <!-- D-Pad Left -->
  <rect x="135" y="240" width="20" height="55" rx="5" fill="#2d3748"/>
  <rect x="117.5" y="257.5" width="55" height="20" rx="5" fill="#2d3748"/>

  <!-- Action Glyphs Right -->
  <!-- Triangle -->
  <polygon points="377,240 385,255 369,255" fill="none" stroke="#2ee68a" stroke-width="4"/>
  <!-- Circle -->
  <circle cx="395" cy="268" r="7" fill="none" stroke="#ff4d6d" stroke-width="4"/>
  <!-- Cross -->
  <line x1="371" y1="281" x2="383" y2="293" stroke="#00d4ff" stroke-width="4" stroke-linecap="round"/>
  <line x1="383" y1="281" x2="371" y2="293" stroke="#00d4ff" stroke-width="4" stroke-linecap="round"/>
  <!-- Square -->
  <rect x="352" y="261" width="14" height="14" rx="2" fill="none" stroke="#ff9f1c" stroke-width="4"/>

  <!-- Symmetrical Analog Sticks -->
  <circle cx="195" cy="330" r="26" fill="#0d1117" stroke="#00d4ff" stroke-width="3"/>
  <circle cx="195" cy="330" r="15" fill="#0072ff"/>
  <circle cx="317" cy="330" r="26" fill="#0d1117" stroke="#00d4ff" stroke-width="3"/>
  <circle cx="317" cy="330" r="15" fill="#0072ff"/>
</svg>
